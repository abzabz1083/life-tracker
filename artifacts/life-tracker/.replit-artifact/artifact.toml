kind = "mobile"
previewPath = "/life-tracker/"
title = "Life Tracker (mobile backup)"
description = "A personal mobile app for daily tasks, income and expense planning, recurring bills, voice notes, study modules, nutrition and macros, and progressive workout tracking with AI insights."
version = "1.0.0"
id = "artifacts/life-tracker"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/life-tracker/" ]
localPort = 23742

[services.development]
run = "pnpm --filter @workspace/life-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/life-tracker", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/life-tracker", "run", "serve" ]

[services.env]
PORT = "23742"
BASE_PATH = "/life-tracker/"
